    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: url("assets/Backgrounds.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            object-fit: cover;
            min-height: 100vh;
        }

        #heading {
            text-align: center;
            background-color: whitesmoke;
            padding: 10px 20px;
            margin: 10px auto;
            color: black;
            font-size: 2em;
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            width: fit-content;
            border-radius: 10px;
        }

        .activity {
            margin: 20px auto;
            padding: 0 2%;
            display: flex;
            gap: 2%;
            align-items: flex-start;
        }

        /* Question Buttons Sidebar - 6% */
        .sidebar {
            width: 100px;
            height: fit-content;
            max-height: 65vh;
            overflow-y: auto;
        }

        .sidebar h3 {
            color: white;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .questionButtons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        
       .qBtn {
            padding: 12% 9%;
            border: none;
            border-radius: 10px;
            background-color: #f5f5f5; /* Grayish white background */
            color: black;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            width: 85%;
            text-align: center;
            box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.8); /* Dark shadow bottom right */
            position: relative;
        }

        .qBtn:hover {
            background-color: #e8e8e8;
            transform: translateY(-1px);
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.7);
        }

        .qBtn.active {
            background-color: #f5f5f5;
            box-shadow: none; /* Remove shadow when active */
            border: 3px solid #000; /* Dark black outline */
            transform: translateY(2px); /* Pressed effect */
        }

        .qBtn:active {
            box-shadow: none;
            border: 3px solid #000;
            transform: translateY(2px);
        }

        /* Story Section - 45% */
        .storySection {
            flex: 0 0 40%;
            background: white;
            border-radius: 20px;
            padding: 15px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            max-height: 70vh;
            min-height: 60vh;
            overflow-y: auto;
        }

        .storyContent {
            font-size: 1.2em;
           
            color: #333;
        }

        .storyContent p {
            margin-bottom: 15px;
        }

        .storyContent strong {
            color: #667eea;
        }

        /* Question Section - 45% */
        .questionSection {
            flex: 0 0 50%;
            display: flex;
            flex-direction: column;
           
        }

        .questionContainer {
            background: white;
            border-radius: 20px;
            padding: 15px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            flex: 1;
            display: flex;
            flex-direction: column;
             max-height: 70vh;
            min-height: 70vh;
            overflow-y: auto;
        }

        .questionText {
            font-size: 1.2em;
            margin-bottom: 8px;
            color: #333;
            line-height: 1.4;
            text-align: center;
            font-weight: 600;
        }

        .optionGrid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 15px;
            margin-bottom: 15px;
            flex: 1;
        }

        .optionBtn {
            padding: 15px 20px;
            border: 3px solid #ddd;
            border-radius: 15px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.3em;
            text-align: center;
            position: relative;
        }

        .optionBtn:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateX(5px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .optionBtn.correct {
            background: #d4edda;
            border-color: #4CAF50;
            color: #155724;
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
        }

        .optionBtn.incorrect {
            background: #f8d7da;
            border-color: #f44336;
            color: #721c24;
            box-shadow: 0 8px 25px rgba(244, 67, 54, 0.4);
        }

        .feedbackSection {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .feedbackText {
            font-size: 1.2em;
            font-weight: bold;
            flex: 1;
        }

        .emoji {
            font-size: 1.5em;
            margin-right: 10px;
        }

        .nextBtn {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .nextBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(76, 175, 80, 0.4);
        }

        .finalScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 400px;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            border-radius: 20px;
            color: white;
            font-size: 2em;
            text-align: center;
        }

        /* Scrollbar styling */
        .storySection::-webkit-scrollbar {
            width: 10px;
        }

        .storySection::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .storySection::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .storySection::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        /* Question Container Scrollbar styling */
        .questionContainer::-webkit-scrollbar {
            width: 10px;
        }

        .questionContainer::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .questionContainer::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .questionContainer::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
        /* Final full screen mode */
.fullscreen-final .sidebar,
.fullscreen-final .storySection {

}

.fullscreen-final .questionSection {
    flex: 0 0 100% !important;
    max-width: 100% !important;
}

.fullscreen-final .questionContainer {
    max-height: none;
    height: 70vh;
}

    </style>
</head>

        window.onload = () => {
            renderButtons();
            renderStory();
            renderQuestion();

        function renderButtons() {
            const container = document.getElementById('questionButtons');
            container.innerHTML = '';
            data.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.innerText = item.questionNo;
                btn.className = 'qBtn' + (index === currentIndex ? ' active' : '');
                btn.onclick = () => {
                    currentIndex = index;
                    selectedAnswer = null;
                    renderStory();
                    renderQuestion();
                };
                container.appendChild(btn);
            });
        }

        function renderStory() {
            const storyContent = document.getElementById('storyContent');
            const q = data[currentIndex];
            
            if (q.story && Array.isArray(q.story)) {
                storyContent.innerHTML = q.story.join('');
            } else if (q.story) {
                storyContent.innerHTML = q.story;
            } else {
                storyContent.innerHTML = '<p>No story content available.</p>';
            }
        }

    questionContent.style.display = 'none';
    finalScreen.style.display = 'flex';

    // Enable full screen final view
    document.querySelector('.activity').classList.add('fullscreen-final');

    return;
}


            const q = data[currentIndex];
            let html = '';

            html += `<h3 class='questionText'>${q.question}</h3>`;
            html += `<div class="optionGrid">`;
            
            q.options.forEach((opt, idx) => {
                html += `<button class="optionBtn" onclick="handleOptionClick(${idx})">${opt}</button>`;
            });

            html += `</div>`;
            html += `<div class="feedbackSection">
                        <p class="feedbackText" id="feedbackText"></p>
                        <button class="nextBtn" id="nextBtn" style="display:none;" onclick="handleNext()">Next</button>
                     </div>`;

            questionContent.innerHTML = html;
            questionContent.style.display = 'block';
            finalScreen.style.display = 'none';
            renderButtons();
        }

        function handleOptionClick(index) {
            if (selectedAnswer !== null) return;

            selectedAnswer = index;
            const q = data[currentIndex];
            const feedback = document.getElementById('feedbackText');
            const nextBtn = document.getElementById('nextBtn');
            const optionBtns = document.querySelectorAll('.optionBtn');

            optionBtns.forEach((btn) => {
                btn.style.pointerEvents = 'none';
            });

            if (index === q.correct) {
                optionBtns[index].classList.add('correct');
                feedback.innerHTML = `<span class='emoji'>✅</span> Correct! Great job!`;
                feedback.style.color = '#4CAF50';
                nextBtn.innerText = currentIndex + 1 < data.length ? 'Next' : 'Finish';
                nextBtn.style.display = 'block';
            } else {
                optionBtns[index].classList.add('incorrect');
                feedback.innerHTML = `<span class='emoji'>❌</span> Try again!`;
                feedback.style.color = '#f44336';

                optionBtns.forEach((btn, idx) => {
                    if (idx !== index) {
                        btn.style.pointerEvents = 'auto';
                    }
                });
                selectedAnswer = null;
            }
        }

        function handleNext() {
            if (currentIndex + 1 < data.length) {
                currentIndex++;
                selectedAnswer = null;
                renderStory();
                renderQuestion();
            } else {
                currentIndex++;
                renderQuestion();
            }
        }
    </script>
